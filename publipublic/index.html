<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinguaBot - تعلم مع الذكاء الاصطناعي</title>
  <!-- Google Ads Tag - بدل G-XXXX ب ID ديالك -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-XXXXXXXX');
    function trackConversion() { gtag('event', 'conversion', {'send_to': 'AW-XXXXXXXX/xxxx'}); }
  </script>
  <style>body{font-family:sans-serif;max-width:600px;margin:auto;padding:20px} #chat{border:1px solid #ddd;height:400px;overflow:auto;padding:10px} .ad{margin:15px 0;background:#f5f5f5;padding:10px;text-align:center}</style>
</head>
<body>
  <h1>🤖 LinguaBot - كيهضر بݣاع اللغات</h1>
  <div class="ad"> بلاصة إعلان Google AdSense ديالك - كتخلص عليها </div>
  <div id="chat"></div>
  <input id="msg" placeholder="كتب هنا..." style="width:80%"><button onclick="send()">سيفط</button>

  <script>
    async function send(){
      const m = document.getElementById('msg').value;
      document.getElementById('chat').innerHTML += `<p><b>أنت:</b> ${m}</p>`;
      trackConversion(); // كيحسبها Google Ads
      const r = await fetch(`/chat?message=${encodeURIComponent(m)}`);
      const d = await r.json();
      document.getElementById('chat').innerHTML += `<p><b>البوت:</b> ${d.reply}</p>`;
      document.getElementById('msg').value='';
    }
  </script>
</body>
  </html>
